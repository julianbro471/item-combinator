plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	// Client-only code lives in src/client, everything else in src/main.
	splitEnvironmentSourceSets()

	mods {
		"combinator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Automatic tests (src/gametest). They are not part of the mod .jar.
//   gradlew runGameTest    starts a server without a player and tries out every item
//   gradlew runClientTest  starts the real game, opens the Combiner Table and takes screenshots
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "combinator_test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

loom {
	runs {
		clientTest {
			client()
			name "Client Test"
			source sourceSets.gametest
			vmArg "-Dcombinator.clientTest=true"
			programArgs "--width", "1280", "--height", "720"
			runDir "build/run/clientTest"
			ideConfigGenerated false
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
