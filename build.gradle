plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

loom {
	// Client-only code lives in src/client, everything else in src/main.
	splitEnvironmentSourceSets()

	mods {
		"combinator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Automatic tests (src/gametest). They are not part of the mod .jar.
//   gradlew runGameTest    starts a server without a player and tries out every item
//   gradlew runClientTest  starts the real game, opens the Combiner Table and takes screenshots
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "combinator_test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

loom {
	runs {
		clientTest {
			client()
			name "Client Test"
			source sourceSets.gametest
			vmArg "-Dcombinator.clientTest=true"
			programArgs "--width", "1280", "--height", "720"
			runDir "build/run/clientTest"
			ideConfigGenerated false
		}
	}
}

// Tests with the finished .jar, started the way players start the game: with the real Fabric API file
// and without the helpers of the development setup.
//   gradlew prodServerTest  the server tests again, against the finished .jar
//   gradlew prodClientTest  the client test again, against the finished .jar (on Linux it needs xvfb)
tasks.register('gametestJar', Jar) {
	from sourceSets.gametest.output
	destinationDirectory = layout.buildDirectory.dir('devlibs')
	archiveClassifier = 'tests-dev'
}

tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
	dependsOn tasks.named('gametestJar')
	inputFile = tasks.named('gametestJar').flatMap { it.archiveFile }
	classpath.from sourceSets.gametest.compileClasspath
	destinationDirectory = layout.buildDirectory.dir('testlibs')
	archiveClassifier = 'tests'
	addNestedDependencies = false
}

tasks.register('prodServerTest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
	mods.from tasks.named('remapGametestJar')
	jvmArgs.add '-Dfabric-api.gametest'
	runDir = layout.buildDirectory.dir('run/prodServerTest')
}

tasks.register('prodClientTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.from tasks.named('remapGametestJar')
	jvmArgs.add '-Dcombinator.clientTest=true'
	programArgs.addAll '--width', '1280', '--height', '720'
	runDir = layout.buildDirectory.dir('run/prodClientTest')
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The Fabric API file that players install, for the tests that run the finished .jar.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
