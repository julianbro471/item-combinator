# Makes a GitHub release with the finished mod .jar.
# Start it by hand (Actions > release > Run workflow, on main): it makes the tag v<version> from gradle.properties.
# Pushing a version tag (like v1.5.0) also starts it.
# The text of the release comes from .github/release-notes/<tag>.md, or else from the message of the tag.
# The commit should already have passed the tests of the "build" workflow on main.
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -x runGameTest --stacktrace
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          if [ -f ".github/release-notes/${tag}.md" ]; then
            cp ".github/release-notes/${tag}.md" notes.md
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # The checkout keeps only the commit, so the tag (with its message) is fetched again.
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            git tag -l --format='%(contents)' "${tag}" > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "Item Combinator ${version} for Minecraft Java Edition 1.21.1 (Fabric)." > notes.md
          fi
          jars=$(find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar')
          gh release create "${tag}" ${jars} \
            --target "${GITHUB_SHA}" \
            --title "Item Combinator ${version} (Minecraft Java Edition 1.21.1, Fabric)" \
            --notes-file notes.md \
            --latest
