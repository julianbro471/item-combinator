# Builds the mod on every push.
# The finished .jar is attached to the run as "item-combinator-jar".
# For pushes to main, the .jar and the build log are also put on the "builds" branch,
# so the newest build can be downloaded straight from the repository.
name: build
on:
  push:
    branches-ignore:
      - 'builds'
      - 'builds-**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          set -o pipefail
          ./gradlew build -x runGameTest --stacktrace 2>&1 | tee build.log
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: item-combinator-jar
          path: build/libs/
      - name: automatic tests (a server without a player tries out every item)
        timeout-minutes: 30
        run: |
          set -o pipefail
          ./gradlew runGameTest --stacktrace 2>&1 | tee gametest.log
      - name: publish the result on the builds branch
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ github.ref_name == 'main' && 'builds' || format('builds-{0}', github.ref_name) }}
        run: |
          mkdir -p published
          cp build/libs/*.jar published/ 2>/dev/null || true
          cp build.log published/ 2>/dev/null || true
          cp gametest.log published/ 2>/dev/null || true
          echo "Built from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}" > published/README.txt
          cd published
          git init -q -b "${TARGET}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${TARGET}"
